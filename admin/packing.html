<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Packing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1714; --panel:#231F1C; --panel2:#2B2724; --line:rgba(244,236,224,.14);
    --ink:#F4ECE0; --mute:#8F877C;
    --go:#3E7C6A; --clay:#B87946; --warn:#F9A825; --done:#4CAF50;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:max(14px,env(safe-area-inset-top)) 13px calc(30px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%}
  h1{font-family:Caveat,serif; font-size:31px; font-weight:600; margin:0}
  .sub{color:var(--mute); font-size:12.5px; margin:1px 0 16px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:11px}
  .lbl{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--clay); font-weight:700; margin-bottom:10px}
  button{font:inherit; cursor:pointer; border-radius:11px; border:1px solid var(--line);
    background:var(--panel2); color:var(--ink); padding:12px 14px}
  button.primary{background:var(--go); border-color:transparent; color:#fff; font-weight:800; width:100%; font-size:15px}
  button.primary:disabled{background:var(--panel2); color:var(--mute); font-weight:600}
  button.wide{width:100%}
  .stack{display:flex; flex-direction:column; gap:8px}

  .bk{border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:7px; background:var(--panel2)}
  .bk.done{border-color:rgba(76,175,80,.5)}
  .bk-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .bk-name{font-weight:700; font-size:14.5px}
  .bk-count{font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums; white-space:nowrap}
  .bar{height:5px; border-radius:3px; background:rgba(244,236,224,.1); margin-top:8px; overflow:hidden}
  .bar i{display:block; height:100%; border-radius:3px; background:var(--go); transition:width .35s}
  .missing{font-size:11.5px; color:var(--mute); margin-top:6px}
  .pill{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
    background:rgba(76,175,80,.16); color:var(--done); margin-left:6px}

  #shot{position:relative; margin-bottom:10px; display:none}
  #shot canvas{width:100%; border-radius:12px; display:block}
  .prog{color:var(--mute); font-size:13px; text-align:center; padding:12px 0}
  .note{font-size:12px; color:var(--mute); line-height:1.55; margin-top:10px}
  .empty{color:var(--mute); font-size:13px}

  #cropper{display:none; position:fixed; inset:0; z-index:50; background:#141110;
    flex-direction:column; padding:max(12px,env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
  #cropper.on{display:flex}
  .crophead{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px}
  .cropstage{position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
    touch-action:none; overflow:hidden}
  .cropstage img{max-width:100%; max-height:100%; object-fit:contain; border-radius:10px; display:block}
  #cropBox{position:absolute; border:2px solid var(--done); border-radius:4px; pointer-events:none;
    box-shadow:0 0 0 9999px rgba(0,0,0,.55); display:none}
  .cropfoot{padding-top:12px; display:flex; flex-direction:column; gap:10px}
  .cropfoot input[type=range]{width:100%; accent-color:var(--go)}
</style>
</head>
<body>

<h1>Packing</h1>
<div class="sub" id="sub">Loading what's outstanding…</div>

<div class="card">
  <div class="lbl">Still to find</div>
  <div id="bookings"><div class="empty">Loading…</div></div>
</div>

<div class="card">
  <div class="lbl">Where you're looking</div>
  <div id="shot"><canvas id="canvas"></canvas></div>
  <div class="prog" id="prog" style="display:none"></div>
  <div class="stack">
    <button class="primary" id="sweepBtn">Photograph a surface</button>
    <button class="wide" id="identifyBtn">What is this one piece?</button>
  </div>
  <div class="note" id="note"></div>
</div>

<div id="cropper">
  <div class="crophead">
    <div>
      <div style="font-family:Caveat,serif;font-size:24px">Which piece?</div>
      <div style="font-size:12px;color:var(--mute)">Tap it, then size the box to fit it</div>
    </div>
    <button id="cropCancel">Cancel</button>
  </div>
  <div class="cropstage" id="cropStage">
    <img id="cropImg" alt="">
    <div id="cropBox"></div>
  </div>
  <div class="cropfoot">
    <input type="range" id="cropSize" min="6" max="70" value="26">
    <button class="primary" id="cropOk">Use this</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────
// PACKING — one flow, replacing three separate piece-finders.
//
// The app had grown three tools that all did versions of the same job:
// "identify a piece" (photo -> which booking), "find on shelves"
// (booking -> where are its pieces), and "read the Nº on the bases"
// (OCR -> which booking). Each held its own state, each had to be
// found in a different place, and none of them knew what the others
// had already worked out. Packing is not three tasks — it's one
// session with a single question running through it: what's still
// outstanding, and where is it?
//
// So this is a session, not a tool. It holds every outstanding booking
// at once, and every photograph is asked about ALL of them together.
//
// Simplest bookings first, which Daisy called for and which turns out
// to be more than a convenience: a one-piece booking that completes
// early is removed from the running, so it can no longer be confused
// with anything in a later photo. The search genuinely gets easier as
// it goes.
// ─────────────────────────────────────────────────────────────────────

const API = location.origin;
const studioId = new URLSearchParams(location.search).get('studio')
  || 'fab8b2d2-27b5-47ec-8c56-268bbf821dc3';
const $ = id => document.getElementById(id);

let bookings = [];          // [{ id, pieces:[{id, type, fp, found}] }]
let surfaceCount = 0;

// ── matching (same three-stage engine as the test bench) ─────────────
// Kept as a copy rather than imported: this page must keep working
// even while the main dashboard is being changed, and today proved how
// easily a shared edit breaks something a screen away.

function colourHistogram(bmp, sx, sy, side) {
  const N = 48, c = document.createElement('canvas');
  c.width = N; c.height = N;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, sx, sy, side, side, 0, 0, N, N);
  const d = ctx.getImageData(0,0,N,N).data;
  const bins = new Array(108).fill(0), hueBins = new Array(12).fill(0);
  let hueWeight = 0, counted = 0;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i]/255, g = d[i+1]/255, b = d[i+2]/255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b), delta = max - min;
    let h = 0;
    if (delta > 0.0001) {
      if (max === r) h = ((g-b)/delta) % 6;
      else if (max === g) h = (b-r)/delta + 2;
      else h = (r-g)/delta + 4;
      h *= 60; if (h < 0) h += 360;
    }
    const s = max === 0 ? 0 : delta/max, v = max;
    bins[Math.min(11,Math.floor(h/30))*9 + Math.min(2,Math.floor(s*3))*3 + Math.min(2,Math.floor(v*3))]++;
    const wgt = s*v;
    hueBins[Math.min(11,Math.floor(h/30))] += wgt;
    hueWeight += wgt; counted++;
  }
  let hex = '';
  for (const b of bins) hex += Math.min(255, Math.round((b/Math.max(1,counted))*255*6)).toString(16).padStart(2,'0');
  let hueHex = '';
  for (const b of hueBins) hueHex += Math.min(255, Math.round((b/Math.max(0.0001,hueWeight))*255*3)).toString(16).padStart(2,'0');
  return hex + '~' + hueHex;
}

// Hue survives the kiln; intensity does not. An unfired piece is
// chalky and pale, the same piece fired is glossy and vivid, but a
// blue is still a blue — so both histograms are scored and the better
// agreement wins, with a small penalty on the hue-only read because
// it's the looser test.
function histDistance(a, b) {
  if (!a || !b) return 64;
  const [fa, ha] = String(a).split('~'), [fb, hb] = String(b).split('~');
  const inter = (x, y) => {
    if (!x || !y || x.length !== y.length) return null;
    let i = 0, t = 0;
    for (let k = 0; k < x.length; k += 2) {
      const p = parseInt(x.substr(k,2),16), q = parseInt(y.substr(k,2),16);
      i += Math.min(p,q); t += Math.max(p,q);
    }
    return t ? (1 - i/t)*64 : 64;
  };
  const full = inter(fa, fb), hue = (ha && hb) ? inter(ha, hb) : null;
  if (full === null && hue === null) return 64;
  if (hue === null) return full;
  if (full === null) return hue;
  return Math.min(full, hue + 2);
}

function hashRegion(bmp, sx, sy, side) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d', { willReadFrequently: true });
  const grey = (d,i) => 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  const dHash = (w,h) => {
    c.width = w; c.height = h;
    ctx.drawImage(bmp, sx, sy, side, side, 0, 0, w, h);
    const d = ctx.getImageData(0,0,w,h).data, g = [];
    for (let i = 0; i < d.length; i += 4) g.push(grey(d,i));
    let bits = '';
    for (let r = 0; r < h; r++) for (let col = 0; col < w-1; col++)
      bits += g[r*w+col] > g[r*w+col+1] ? '1' : '0';
    let hex = '';
    for (let i = 0; i < bits.length; i += 4) hex += parseInt(bits.slice(i,i+4),2).toString(16);
    return hex;
  };
  const coarse = dHash(9,8), fine = dHash(17,16);
  c.width = 4; c.height = 4;
  ctx.drawImage(bmp, sx, sy, side, side, 0, 0, 4, 4);
  const cd = ctx.getImageData(0,0,4,4).data;
  let colour = '';
  for (let i = 0; i < cd.length; i += 4)
    colour += Math.round(cd[i]/17).toString(16) + Math.round(cd[i+1]/17).toString(16) + Math.round(cd[i+2]/17).toString(16);
  return coarse + '|' + fine + '|' + colour + '|' + colourHistogram(bmp, sx, sy, side);
}

const colourOnly = (a,b) => {
  const pa = String(a).split('|'), pb = String(b).split('|');
  return (pa.length < 4 || pb.length < 4) ? 64 : histDistance(pa[3], pb[3]);
};

function pinDown(a, b) {
  const pa = String(a).split('|'), pb = String(b).split('|');
  const ham = (x,y) => {
    if (!x || !y || x.length !== y.length) return null;
    let d = 0;
    for (let i = 0; i < x.length; i++) {
      let v = parseInt(x[i],16) ^ parseInt(y[i],16);
      while (v) { d += v & 1; v >>= 1; }
    }
    return d;
  };
  const fineRaw = ham(pa[1], pb[1]);
  const fine = fineRaw === null ? 64 : (fineRaw/256)*64;
  let grid = 64;
  if (pa[2] && pb[2] && pa[2].length === pb[2].length) {
    let cd = 0;
    for (let i = 0; i < pa[2].length; i++) cd += Math.abs(parseInt(pa[2][i],16) - parseInt(pb[2][i],16));
    grid = (cd/pa[2].length/15)*64;
  }
  return fine*0.55 + grid*0.25 + colourOnly(a,b)*0.20;
}

function patchStructure(bmp, x, y, side) {
  const c = document.createElement('canvas');
  c.width = 24; c.height = 24;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, x, y, side, side, 0, 0, 24, 24);
  const d = ctx.getImageData(0,0,24,24).data, g = [];
  for (let i = 0; i < d.length; i += 4) g.push(0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]);
  let e = 0, n = 0;
  for (let r = 0; r < 24; r++) for (let col = 0; col < 23; col++) {
    e += Math.abs(g[r*24+col] - g[r*24+col+1]); n++;
    if (r < 23) { e += Math.abs(g[r*24+col] - g[(r+1)*24+col]); n++; }
  }
  return n ? e/n : 0;
}

// ── plumbing ─────────────────────────────────────────────────────────

function pickImage(onPicked) {
  // Opened inside the tap. Any await before .click() loses the gesture
  // and iOS silently declines to open the picker.
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = () => {
    const f = input.files && input.files[0];
    input.remove();
    if (f) { const r = new FileReader(); r.onload = () => onPicked(r.result); r.readAsDataURL(f); }
  };
  input.click();
}

async function bitmapFrom(src, maxSide) {
  const blob = await (await fetch(src)).blob();
  const bmp = await createImageBitmap(blob);
  const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  if (scale >= 1) return bmp;
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width*scale); c.height = Math.round(bmp.height*scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  return await createImageBitmap(c);
}

// ── load what's outstanding ──────────────────────────────────────────

async function load() {
  let pieces = [];
  try {
    const r = await fetch(`${API}/api/packing/queue?studioId=${studioId}`);
    pieces = (await r.json()).pieces || [];
  } catch (e) {
    $('sub').textContent = 'Could not reach the studio server.';
    $('bookings').innerHTML = '<div class="empty">No connection — try again in a moment.</div>';
    return;
  }

  const byBooking = {};
  for (const p of pieces) {
    if (!p.reference_photo_url) continue;   // nothing to search for
    (byBooking[p.booking_id] = byBooking[p.booking_id] || []).push(p);
  }

  bookings = Object.keys(byBooking).map(id => ({
    id,
    pieces: byBooking[id].map(p => ({
      id: p.id, type: p.piece_type || 'Piece', url: p.reference_photo_url, fp: null, found: null,
    })),
  }));

  // Simplest first. A short booking finishes early and drops out of
  // the running, so it can't be confused with anything later.
  bookings.sort((a, b) => a.pieces.length - b.pieces.length || a.id.localeCompare(b.id));

  render();
  $('sub').textContent = bookings.length
    ? `${bookings.length} booking${bookings.length === 1 ? '' : 's'} outstanding · simplest first`
    : 'Nothing outstanding.';

  // Fingerprint every reference here rather than trusting whatever was
  // stored at capture time — one function, one format, no drift.
  let done = 0;
  const total = bookings.reduce((n, b) => n + b.pieces.length, 0);
  for (const b of bookings) {
    for (const p of b.pieces) {
      try {
        const bmp = await bitmapFrom(p.url, 700);
        const side = Math.min(bmp.width, bmp.height);
        p.fp = hashRegion(bmp, Math.round((bmp.width-side)/2), Math.round((bmp.height-side)/2), side);
        bmp.close && bmp.close();
      } catch (e) { p.fp = null; }
      done++;
      if (done % 3 === 0) { $('sub').textContent = `Reading references… ${done} of ${total}`; await new Promise(r => setTimeout(r, 0)); }
    }
  }
  $('sub').textContent = `${bookings.length} booking${bookings.length === 1 ? '' : 's'} outstanding · simplest first`;
  $('sweepBtn').disabled = false;
  render();
}

// ── the session view ─────────────────────────────────────────────────

function render() {
  if (!bookings.length) { $('bookings').innerHTML = '<div class="empty">Nothing outstanding.</div>'; return; }
  $('bookings').innerHTML = bookings.map(b => {
    const found = b.pieces.filter(p => p.found).length;
    const complete = found === b.pieces.length;
    const missing = b.pieces.filter(p => !p.found).map(p => p.type);
    return `<div class="bk ${complete ? 'done' : ''}">
      <div class="bk-top">
        <div class="bk-name">${b.id}${complete ? '<span class="pill">all found</span>' : ''}</div>
        <div class="bk-count">${found} of ${b.pieces.length}</div>
      </div>
      <div class="bar"><i style="width:${Math.round(found/b.pieces.length*100)}%;
        background:${complete ? 'var(--done)' : 'var(--go)'}"></i></div>
      ${!complete && surfaceCount
        ? `<div class="missing">still missing: ${missing.slice(0,4).join(', ')}${missing.length > 4 ? ` +${missing.length-4}` : ''}</div>`
        : ''}
      ${complete ? `<div style="margin-top:9px"><button onclick="markPacked('${b.id.replace(/'/g,"\\'")}')"
        style="width:100%;font-size:13px;padding:9px">Mark this booking packed</button></div>` : ''}
    </div>`;
  }).join('');
}

async function markPacked(id) {
  try {
    await fetch(`${API}/api/pieces/set-booking-status`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ studioId, bookingId: id, status: 'packed', by: 'packing session' }),
    });
    bookings = bookings.filter(b => b.id !== id);
    render();
  } catch (e) { alert('Could not update that booking — try again.'); }
}

// ── sweep a surface ──────────────────────────────────────────────────

$('sweepBtn').disabled = true;
$('sweepBtn').onclick = () => pickImage(async (url) => {
  $('prog').style.display = 'block';
  $('prog').textContent = 'Reading the photo…';
  await new Promise(r => setTimeout(r, 30));
  const bmp = await bitmapFrom(url, 1600);
  await sweep(bmp);
});

async function sweep(bmp) {
  const W = bmp.width, H = bmp.height, short = Math.min(W, H);
  const sizes = [0.09, 0.12, 0.16, 0.21, 0.28, 0.37, 0.48].map(f => Math.round(short*f));
  const SHORTLIST = 50, EDGE = 4, SANITY = 30;

  const patches = [];
  for (const side of sizes) {
    if (side < 24 || side > short) continue;
    const step = Math.max(1, Math.round(side*0.4));
    for (let y = 0; y + side <= H; y += step)
      for (let x = 0; x + side <= W; x += step)
        patches.push({ x, y, side, e: patchStructure(bmp, x, y, side) });
  }
  const es = patches.map(p => p.e).sort((a,b) => a-b);
  const gate = es.length ? es[Math.floor(es.length/2)] : 0;
  const live = patches.filter(p => p.e >= gate);

  for (let i = 0; i < live.length; i++) {
    live[i].fp = hashRegion(bmp, live[i].x, live[i].y, live[i].side);
    if (i % 10 === 0) {
      $('prog').textContent = 'Looking… ' + Math.round((i/live.length)*100) + '%';
      await new Promise(r => setTimeout(r, 0));
    }
  }

  // Every outstanding piece, across every booking, against this one
  // photo. Candidates are pooled and then assigned best-first, so a
  // patch can only ever belong to one piece — the thing three separate
  // tools could never do, because none of them knew about the others.
  const outstanding = [];
  for (const b of bookings) for (const p of b.pieces) if (!p.found && p.fp) outstanding.push({ b, p });

  const cands = [];
  for (const { b, p } of outstanding) {
    const shortlist = live.map(q => ({ q, c: colourOnly(q.fp, p.fp) }))
      .sort((a,z) => a.c - z.c).slice(0, SHORTLIST);
    const pinned = shortlist.map(({q}) => ({ q, d: pinDown(q.fp, p.fp) })).sort((a,z) => a.d - z.d);
    if (!pinned.length) continue;
    const w = pinned[0];
    // Must stand apart from the next-best place SOMEWHERE ELSE, or
    // nothing has been located — the score is just describing what the
    // photo is generally made of.
    const rival = pinned.find(o => {
      const dx = (o.q.x + o.q.side/2) - (w.q.x + w.q.side/2);
      const dy = (o.q.y + o.q.side/2) - (w.q.y + w.q.side/2);
      return Math.hypot(dx, dy) > Math.max(w.q.side, o.q.side)*0.7;
    });
    const edge = rival ? rival.d - w.d : 0;
    if (w.d <= SANITY && edge >= EDGE) cands.push({ b, p, q: w.q, d: w.d, edge });
  }

  cands.sort((a, z) => a.d - z.d);
  const taken = [];
  let newly = 0;
  for (const c of cands) {
    if (c.p.found) continue;
    const clash = taken.some(t => {
      const dx = (t.x + t.side/2) - (c.q.x + c.q.side/2);
      const dy = (t.y + t.side/2) - (c.q.y + c.q.side/2);
      return Math.hypot(dx, dy) < Math.max(t.side, c.q.side)*0.6;
    });
    if (clash) continue;
    c.p.found = { x: c.q.x, y: c.q.y, side: c.q.side, d: c.d, surface: surfaceCount + 1 };
    taken.push(c.q);
    newly++;
  }

  surfaceCount++;
  draw(bmp, outstanding.filter(o => o.p.found && o.p.found.surface === surfaceCount));
  $('prog').style.display = 'none';
  render();

  const left = bookings.reduce((n, b) => n + b.pieces.filter(p => !p.found).length, 0);
  $('note').innerHTML = newly
    ? `<b>Found ${newly} here.</b> ${left ? left + ' still to find — photograph somewhere else and it carries on from here.' : 'That\'s everything.'}`
    : `<b>Nothing here.</b> ${left} still to find. Try another surface, or move things apart if they're stacked.`;
  $('sweepBtn').textContent = 'Photograph somewhere else';
}

function draw(bmp, hits) {
  const cv = $('canvas');
  cv.width = bmp.width; cv.height = bmp.height;
  const ctx = cv.getContext('2d');
  ctx.drawImage(bmp, 0, 0);
  ctx.lineWidth = Math.max(3, Math.round(bmp.width/250));
  ctx.font = '600 ' + Math.max(15, Math.round(bmp.width/46)) + 'px ui-sans-serif,system-ui,sans-serif';
  for (const { b, p } of hits) {
    const f = p.found;
    ctx.strokeStyle = '#4CAF50';
    ctx.beginPath();
    ctx.arc(f.x + f.side/2, f.y + f.side/2, f.side*0.62, 0, Math.PI*2);
    ctx.stroke();
    ctx.fillStyle = '#4CAF50';
    ctx.fillText(b.id, f.x, Math.max(18, f.y - 8));
  }
  $('shot').style.display = 'block';
}

// ── ad hoc: what is this one piece? ──────────────────────────────────
// Kept, because it answers the opposite question and staff genuinely
// need it: a stray piece in the hand, no idea whose it is.

let cropBmp = null, cropOnDone = null, cropCx = .5, cropCy = .5;

function openCropper(bmp, onDone) {
  cropBmp = bmp; cropOnDone = onDone; cropCx = .5; cropCy = .5;
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  c.getContext('2d').drawImage(bmp, 0, 0);
  $('cropImg').src = c.toDataURL('image/jpeg', .9);
  $('cropper').classList.add('on');
  setTimeout(drawCropBox, 60);
}
function cropGeometry() {
  const img = $('cropImg'), r = img.getBoundingClientRect();
  const stage = $('cropStage').getBoundingClientRect();
  const frac = parseInt($('cropSize').value, 10)/100;
  const sideImg = Math.round(Math.min(cropBmp.width, cropBmp.height)*frac);
  const scale = r.width / cropBmp.width, sideScreen = sideImg*scale;
  let cx = cropCx*cropBmp.width, cy = cropCy*cropBmp.height;
  cx = Math.max(sideImg/2, Math.min(cropBmp.width - sideImg/2, cx));
  cy = Math.max(sideImg/2, Math.min(cropBmp.height - sideImg/2, cy));
  cropCx = cx/cropBmp.width; cropCy = cy/cropBmp.height;
  return { sx: Math.round(cx - sideImg/2), sy: Math.round(cy - sideImg/2), side: sideImg,
    left: (r.left - stage.left) + cx*scale - sideScreen/2,
    top: (r.top - stage.top) + cy*scale - sideScreen/2, px: sideScreen };
}
function drawCropBox() {
  if (!cropBmp) return;
  const g = cropGeometry(), box = $('cropBox');
  box.style.display = 'block';
  box.style.left = g.left+'px'; box.style.top = g.top+'px';
  box.style.width = g.px+'px'; box.style.height = g.px+'px';
}
function placeCrop(ev) {
  const r = $('cropImg').getBoundingClientRect();
  cropCx = Math.max(0, Math.min(1, (ev.clientX - r.left)/r.width));
  cropCy = Math.max(0, Math.min(1, (ev.clientY - r.top)/r.height));
  drawCropBox();
}
$('cropStage').addEventListener('pointerdown', placeCrop);
$('cropStage').addEventListener('pointermove', e => { if (e.buttons) placeCrop(e); });
$('cropSize').addEventListener('input', drawCropBox);
$('cropCancel').onclick = () => { $('cropper').classList.remove('on'); cropBmp = null; };
$('cropOk').onclick = () => {
  const g = cropGeometry(), bmp = cropBmp, done = cropOnDone;
  $('cropper').classList.remove('on'); cropBmp = null; cropOnDone = null;
  done(bmp, g.sx, g.sy, g.side);
};

$('identifyBtn').onclick = () => pickImage(async (url) => {
  const bmp = await bitmapFrom(url, 1100);
  openCropper(bmp, (b, sx, sy, side) => {
    const fp = hashRegion(b, sx, sy, side);
    b.close && b.close();
    const scored = [];
    for (const bk of bookings) for (const p of bk.pieces) {
      if (!p.fp) continue;
      scored.push({ bk, p, d: pinDown(fp, p.fp) });
    }
    scored.sort((a, z) => a.d - z.d);
    if (!scored.length) { $('note').textContent = 'Nothing outstanding to compare against.'; return; }
    const best = scored[0], next = scored.find(s => s.bk.id !== best.bk.id);
    const edge = next ? next.d - best.d : null;
    // A nearest match is not an answer. Without daylight between the
    // top two it's a guess, and saying so is more use than a name.
    $('note').innerHTML = (best.d <= 30 && edge !== null && edge >= 4)
      ? `Looks like <b>${best.bk.id}</b> — ${best.p.type} (match ${best.d.toFixed(1)}, clear of the next by ${edge.toFixed(1)}).`
      : `Not sure. Closest is <b>${best.bk.id}</b> (${best.p.type}, match ${best.d.toFixed(1)}${edge !== null ? `, only ${edge.toFixed(1)} ahead of the next booking` : ''}) — too close to call, so treat it as a guess.`;
  });
});

load();
</script>
</body>
</html>
