name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy Backend
        run: |
          curl -X POST https://api.render.com/deploy/srv-cqg7j3dhcds0000m1a3g?key=${{ secrets.RENDER_API_KEY }}
      
      - name: Deploy Frontend
        run: |
          curl -X POST https://api.render.com/deploy/srv-cqgb1fdhcds0000m1a40?key=${{ secrets.RENDER_API_KEY }}
      
      - name: Wait for deployment
        run: sleep 120
      
      - name: Health check
        run: |
          curl -f https://glazeup-api.onrender.com/api/health || echo "Backend still starting..."
